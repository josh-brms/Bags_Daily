<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bags Daily PH — The Collection</title>
    <meta
      name="description"
      content="Bags Daily PH is an independent studio in Legazpi City, Philippines offering a small, considered collection of everyday pieces in warm neutral tones. Every piece opens on Instagram."
    />
    <meta name="theme-color" content="#FAF8F6" />
    <link rel="canonical" href="https://josh-brms.github.io/Bags_Daily/" />

    <!--
      Social preview URLs are hardcoded because crawlers do not run JavaScript, so
      they cannot be filled in at runtime. The GitHub Pages URL is the documented
      deploy (see README). If you deploy to Vercel or a custom domain, update
      og:url, og:image and the canonical link to match.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bags Daily PH" />
    <meta property="og:title" content="Bags Daily PH — The Collection" />
    <meta
      property="og:description"
      content="A small, considered collection in warm neutral tones, made in Legazpi City, Philippines."
    />
    <meta property="og:url" content="https://josh-brms.github.io/Bags_Daily/" />
    <meta property="og:image" content="https://josh-brms.github.io/Bags_Daily/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bags Daily PH — The Collection" />
    <meta
      name="twitter:description"
      content="A small, considered collection in warm neutral tones, made in Legazpi City, Philippines."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last-resort message if the app never mounts. Deliberately generous: the
      // splash resolves at 2.5s, so React is normally visible well before this,
      // and a shorter window used to wipe pages that were about to render.
      window.setTimeout(function () {
        var root = document.getElementById('root')
        if (root && root.childElementCount === 0) {
          document.body.innerHTML =
            '<div style="font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#FAF8F6;color:#211D1B;padding:24px">' +
            '<h1 style="font-size:1.3rem;font-weight:600;margin:0 0 12px">This page did not load</h1>' +
            '<p style="color:#6E645F;margin:0 0 24px;max-width:34ch">The site was updated recently and your browser may be showing a saved copy. Reload to fetch the current version.</p>' +
            '<button onclick="location.reload()" style="font:inherit;font-size:0.9rem;background:#211D1B;color:#FAF8F6;border:0;border-radius:999px;padding:12px 22px;cursor:pointer">Reload the page</button>' +
            '</div>'
        }
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
